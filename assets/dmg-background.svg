<svg width="1320" height="800" viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191a22" />
      <stop offset="40%" stop-color="#121318" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78521a" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="660" height="400" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="658" height="398" rx="8" fill="none" stroke="#242630" stroke-width="1.5" />
  <rect x="2" y="2" width="656" height="396" rx="7" fill="none" stroke="#000000" stroke-opacity="0.6" stroke-width="1" />
  <g transform="translate(0, 48)">
    <text x="330" y="0" font-family="-apple-system, BlinkMacSystemFont, 'IBM Plex Mono', monospace" font-size="16" font-weight="900" letter-spacing="4" fill="#fde68a" text-anchor="middle" filter="url(#glow)">
      TRIMBIN
    </text>
    <text x="330" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#8e897e" text-anchor="middle">
      TACTILE NLE SILENCE CUTTING CONSOLE
    </text>
    <line x1="180" y1="28" x2="480" y2="28" stroke="url(#lineGrad)" stroke-width="1" />
  </g>

  <!-- Left Icon Slot Target (App) -->
  <g transform="translate(175, 195)">
    <!-- Faint drop-zone circle / brackets -->
    <rect x="-70" y="-70" width="140" height="140" rx="24" fill="#0d0e12" fill-opacity="0.4" stroke="#2a2c38" stroke-width="1" stroke-dasharray="4 4" />
    <!-- Label Below -->
    <text x="0" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#e2e8f0" text-anchor="middle">
      TrimBin
    </text>
  </g>

  <!-- Center Connecting Drag Arrow Graphic -->
  <g transform="translate(330, 195)">
    <!-- Animated Style Arrow Body -->
    <path d="M -45,0 L 25,0" stroke="url(#arrowGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M 12,-12 L 30,0 L 12,12" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    
    <!-- Micro knurling or tech-dots along the arrow -->
    <circle cx="-35" cy="0" r="1.5" fill="#090a0d" />
    <circle cx="-25" cy="0" r="1.5" fill="#090a0d" />
    <circle cx="-15" cy="0" r="1.5" fill="#090a0d" />
    <circle cx="-5" cy="0" r="1.5" fill="#090a0d" />
    <circle cx="5" cy="0" r="1.5" fill="#090a0d" />
  </g>

  <!-- Right Icon Slot Target (Applications) -->
  <g transform="translate(485, 195)">
    <!-- Distinct drop-zone for Applications folder -->
    <rect x="-70" y="-70" width="140" height="140" rx="24" fill="#090a0d" fill-opacity="0.8" stroke="#1f2029" stroke-width="1" />
    <!-- Subtle inset shadow effect -->
    <rect x="-69" y="-69" width="138" height="138" rx="23" fill="none" stroke="#000000" stroke-opacity="0.9" stroke-width="1.5" />
    <text x="0" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#94a3b8" text-anchor="middle">
      Applications
    </text>
  </g>
</svg>
